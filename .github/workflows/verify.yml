name: Verify talent platform

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Application and OCR
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install document and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          python -m pip install -r requirements-core.txt -r requirements-test.txt -r requirements-resume.txt
          python -c 'import pypdfium2'
          tesseract --list-langs | grep -Fx eng
          tesseract --list-langs | grep -Fx chi_sim
      - name: Verify application and frontend
        run: |
          python -m pytest -q -p no:cacheprovider -rs
          npm --prefix frontend run check

  compose:
    name: PostgreSQL, pgvector, Redis and MinIO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare synthetic integration environment
        run: |
          python -m pip install -r requirements-core.txt -r requirements-test.txt
          python scripts/setup_env.py --profile compose
          docker compose config --quiet
      - name: Build and start Compose
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          docker compose exec -T api python -m backend.app.cli seed
      - name: Verify migrations, readiness and business flows
        run: |
          docker compose exec -T api python -m alembic check
          python scripts/smoke_phase_one.py --require-compose
          python scripts/smoke_resume.py
      - name: Report service states
        if: always()
        run: docker compose ps -a
      - name: Remove ephemeral services and volumes
        if: always()
        run: docker compose down -v
