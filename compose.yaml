name: ai-talent-hub
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: talent
      POSTGRES_DB: talent
      POSTGRES_PASSWORD: ${TALENT_POSTGRES_PASSWORD:?Run setup_env.py first}
    ports: ["127.0.0.1:15432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent -d talent"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${TALENT_MINIO_ACCESS_KEY:?Run setup_env.py first}
      MINIO_ROOT_PASSWORD: ${TALENT_MINIO_SECRET_KEY:?Run setup_env.py first}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: [miniodata:/data]
  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment: &backend_environment
      TALENT_PROFILE: compose
      TALENT_DATABASE_URL: postgresql+psycopg://talent:${TALENT_POSTGRES_PASSWORD}@postgres:5432/talent
      TALENT_REDIS_URL: redis://redis:6379/0
      TALENT_MINIO_ENDPOINT: minio:9000
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment: *backend_environment
    command: ["python", "-m", "backend.app.ai_resume.worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    environment:
      TALENT_WEB_PORT: "5173"
      TALENT_WEB_HOST: "0.0.0.0"
      TALENT_API_ORIGIN: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
  miniodata:
