name: ai-digital-talent-platform
x-environment: &environment
  DATABASE_HOST_OVERRIDE: host.docker.internal
  REDIS_URL: redis://host.docker.internal:6379/9
  MINIO_ENDPOINT: host.docker.internal:9000
  MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
  NEO4J_URI: bolt://host.docker.internal:7687
  MILVUS_URI: http://host.docker.internal:19530
  LLM_BASE_URL: http://host.docker.internal:20128/v1
  EMBEDDING_BASE_URL: http://host.docker.internal:11434
services:
  web:
    image: ai-digital-talent-platform:0.1.0
    build: .
    env_file: .env
    environment: *environment
    ports:
      - '127.0.0.1:8088:8000'
    restart: unless-stopped
  worker:
    image: ai-digital-talent-platform:0.1.0
    env_file: .env
    environment: *environment
    command: [python, -m, app.worker]
    healthcheck:
      disable: true
    restart: unless-stopped
