<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · AI数字化人才平台</title><link rel="stylesheet" href="/static/app.css"><script defer src="/static/app.js"></script></head>
<body class="login-page">
<main class="login-shell"><section class="login-brand"><div class="brand-line"><span class="brand-symbol">T</span><span>AI数字化人才平台</span></div>
