[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-digital-talent-platform"
version = "0.1.0"
description = "面向 HR 的 AI 数字化人才平台"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "pymysql>=1.1,<2", "alembic>=1.14,<2",
  "PyJWT>=2.10,<3", "argon2-cffi>=23,<26", "redis>=5,<7", "rq>=2,<3",
  "minio>=7.2,<8", "neo4j>=5,<7", "pymilvus>=2.6,<2.7",
  "langchain>=1,<2", "langgraph>=1,<2", "langchain-openai>=1,<2",
  "httpx>=0.28,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "reportlab>=4,<5", "cryptography>=44"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "playwright>=1.50,<2"]

[project.scripts]
talent = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: 需要真实基础服务和专用测试命名空间", "e2e: 真实模型与网页验收"]

[tool.ruff]
line-length = 110
target-version = "py311"
